<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">LikeThis: Record, name, review</title>
  <desc id="desc">A simple three-step flow. Record or import a task, give it an app and task name, then review it from Saved tasks. Supported file recipes are checked separately.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1eaff"/>
      <stop offset="1" stop-color="#fff0e8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3d2b55" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="960" height="300" rx="26" fill="#fbf9ff"/>
  <circle cx="42" cy="30" r="140" fill="url(#wash)" opacity=".7"/>
  <circle cx="920" cy="280" r="155" fill="#fff0e8" opacity=".55"/>

  <text x="54" y="61" fill="#332447" font-family="system-ui, sans-serif" font-size="25" font-weight="700">A task, ready for review</text>
  <text x="54" y="88" fill="#716780" font-family="system-ui, sans-serif" font-size="14">Save a useful example in three small steps.</text>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <rect x="48" y="119" width="258" height="122" rx="18" fill="#fff" stroke="#ded3ef" stroke-width="1.5"/>
    <circle cx="78" cy="150" r="16" fill="#eee5fa"/>
    <text x="78" y="155" text-anchor="middle" fill="#68459a" font-size="13" font-weight="700">1</text>
    <text x="105" y="155" fill="#332447" font-size="17" font-weight="700">Record</text>
    <text x="70" y="192" fill="#716780" font-size="14">Record in your browser</text>
    <text x="70" y="213" fill="#716780" font-size="14">or import a video.</text>

    <rect x="351" y="119" width="258" height="122" rx="18" fill="#fff" stroke="#e8d5cb" stroke-width="1.5"/>
    <circle cx="381" cy="150" r="16" fill="#ffeadf"/>
    <text x="381" y="155" text-anchor="middle" fill="#a65e3c" font-size="13" font-weight="700">2</text>
    <text x="408" y="155" fill="#332447" font-size="17" font-weight="700">Name</text>
    <text x="373" y="192" fill="#716780" font-size="14">Choose the app and task</text>
    <text x="373" y="213" fill="#716780" font-size="14">so you can find it later.</text>

    <rect x="654" y="119" width="258" height="122" rx="18" fill="#fff" stroke="#ded3ef" stroke-width="1.5"/>
    <circle cx="684" cy="150" r="16" fill="#eee5fa"/>
    <text x="684" y="155" text-anchor="middle" fill="#68459a" font-size="13" font-weight="700">3</text>
    <text x="711" y="155" fill="#332447" font-size="17" font-weight="700">Review</text>
    <text x="676" y="192" fill="#716780" font-size="14">Save it, then open it</text>
    <text x="676" y="213" fill="#716780" font-size="14">from Saved tasks.</text>
  </g>

  <path d="M316 180h25m-7-7 7 7-7 7M619 180h25m-7-7 7 7-7 7" fill="none" stroke="#b49acb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="48" y="258" width="864" height="27" rx="13.5" fill="#f4eff9"/>
  <circle cx="66" cy="271.5" r="4" fill="#bd795b"/>
  <text x="79" y="276" fill="#62576f" font-family="system-ui, sans-serif" font-size="12.5">Supported file recipes are checked separately. Saving a recording does not verify execution.</text>
</svg>
