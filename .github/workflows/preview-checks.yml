name: Preview checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 -m pip install -e '.[test]'
      - run: python3 -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pytest -q
      - run: python3 -m compileall -q likethis __init__.py
      - run: node --check web/app.js
      - run: python3 -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/likethis-wheels"
      - run: python3 -m venv "$RUNNER_TEMP/likethis-wheel-env"
      - run: '"$RUNNER_TEMP/likethis-wheel-env/bin/pip" install "$RUNNER_TEMP"/likethis-wheels/likethis-*.whl httpx'
      - run: '"$RUNNER_TEMP/likethis-wheel-env/bin/python" tests/wheel_smoke.py'
