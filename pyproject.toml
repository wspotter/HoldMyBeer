[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdmybeer"
description = "Teach and check browser workflows by demonstration"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["version"]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "playwright>=1.42,<2",
  "mcp>=1.0,<2",
]

[project.scripts]
holdmybeer = "holdmybeer.cli:main"
holdmybeer-mcp = "holdmybeer.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "holdmybeer.__version__"}

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["holdmybeer"]
